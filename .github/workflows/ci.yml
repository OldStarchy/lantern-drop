name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (levels, audio)
        run: npm test

      - name: Build
        run: npm run build

      - name: Check committed index.html is up to date
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.html
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:smoke

      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp index.html _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
